<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCR Follow-up Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Thai:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#007AC8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>NCR Follow-up Control <span id="mode" class="chip demo" hidden title="Data is stored only in this browser. Connect Google Sheets in Settings to share and keep it permanently.">Browser-only data</span></div>
    <nav>
      <a href="#/home">Home</a>
      <a href="#/list">Open NCRs <span id="today-badge" class="nbadge"></span></a>
      <a href="#/closed">Closed</a>
      <a href="#/import">Import Excel</a>
      <a href="#/settings">Settings</a>
    </nav>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch between light and dark mode" title="Light / dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="btn primary" id="add-btn">+ Add NCR</button>
  </header>
  <aside class="rail"><a href="#/home">Home</a><a href="#/list">Open</a><a href="#/closed">Closed</a><a href="#/import">Import</a></aside>
  <div id="sync" class="sync"></div>
  <main id="main" class="wrap"><div class="empty">Loading…</div></main>
  <dialog id="modal"></dialog>
  <div id="bulkbar" hidden></div>
  <div id="toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
