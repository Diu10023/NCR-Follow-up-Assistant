<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCR Follow-up Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Noto+Sans+Thai:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Ranchers&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M4 11 L9 16 L18 5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="square"/></svg></span>NCR Follow-up Control <span id="mode" class="chip demo" hidden title="Data is stored only in this browser. Connect Google Sheets in Settings to share and keep it permanently.">Browser-only data</span></div>
    <nav>
      <a href="#/home">Summary</a>
      <a href="#/today">Today <span id="today-badge" class="nbadge"></span></a>
      <a href="#/list">Open NCRs</a>
      <a href="#/closed">Closed</a>
      <a href="#/import">Import Excel</a>
      <a href="#/settings">Settings</a>
    </nav>
    <button class="btn primary" id="add-btn">+ Add NCR</button>
  </header>
  <aside class="rail"><a href="#/home">Summary</a><a href="#/today">Today</a><a href="#/list">Open</a><a href="#/closed">Closed</a><a href="#/import">Import</a></aside>
  <div id="sync" class="sync"></div>
  <main id="main" class="wrap"><div class="empty">Loading…</div></main>
  <dialog id="modal"></dialog>
  <div id="bulkbar" hidden></div>
  <div id="toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
