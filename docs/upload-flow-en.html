<!doctype html><html lang="en"><head><meta charset="utf-8"><title>NCR Follow-up Control: what happens at each upload</title>
<style>
body{margin:0;background:#fff;color:#3D4852;font-family:Loma,"DejaVu Sans",Arial,sans-serif}
figure{margin:0;padding:26px 30px 22px}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:14px;color:#6B7280;margin:0 0 10px}
svg{display:block;width:100%;height:auto}
text{font-family:Loma,"DejaVu Sans",Arial,sans-serif;fill:#3D4852;stroke:none}
.t{font-size:15px;font-weight:700}.s{font-size:12.5px;fill:#5b6572}
.l{font-size:12.5px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px}
.box{fill:#fff;stroke:#3D4852;stroke-width:1.6}
</style></head><body><figure>
<h1>NCR Follow-up Control: what happens at each upload</h1><p class="sub">Decision flow for every NCR when a new weekly file is imported</p>
<svg viewBox="0 0 1440 1030"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3D4852"/></marker></defs>
<g fill="none" stroke="#3D4852" stroke-width="1.8"><rect class="box" x="570" y="40" width="300" height="70" rx="14" stroke="#3D4852" stroke-width="1.6"/><text class="t" x="720.0" y="68" text-anchor="middle">Upload next week’s file</text><text class="s" x="720.0" y="90" text-anchor="middle">Uploads → Import, check the preview</text><line x1="720" y1="110" x2="720" y2="140" marker-end="url(#a)"/><rect class="box" x="570" y="140" width="300" height="70" rx="14" stroke="#3D4852" stroke-width="1.6"/><text class="t" x="720.0" y="168" text-anchor="middle">Match every NCR by NCR No.</text><text class="s" x="720.0" y="190" text-anchor="middle">with the data already saved</text><line x1="720" y1="210" x2="720" y2="240" marker-end="url(#a)"/><polygon class="box" points="720,240 920,300 720,360 520,300" stroke="#007AC8" stroke-width="2.2"/><text class="t" x="720" y="298" text-anchor="middle">In the new file</text><text class="t" x="720" y="318" text-anchor="middle">and in the saved data?</text><line x1="520" y1="300" x2="330" y2="300" marker-end="url(#a)"/><text class="l" x="425" y="288" text-anchor="middle">Only in the file</text><rect class="box" x="60" y="270" width="270" height="70" rx="14" stroke="#3D4852" stroke-width="1.6"/><text class="t" x="195.0" y="298" text-anchor="middle">New NCR</text><text class="s" x="195.0" y="320" text-anchor="middle">never seen before</text><line x1="195" y1="340" x2="195" y2="380" marker-end="url(#a)"/><rect class="box" x="60" y="380" width="270" height="80" rx="14" stroke="#C0392B" stroke-width="2.4"/><text class="t" x="195.0" y="408" text-anchor="middle">To follow up</text><text class="s" x="195.0" y="430" text-anchor="middle">Red: No remark · Orange: Has remark</text><line x1="920" y1="300" x2="1110" y2="300" marker-end="url(#a)"/><text class="l" x="1015" y="288" text-anchor="middle">Only in saved data</text><rect class="box" x="1110" y="270" width="270" height="70" rx="14" stroke="#3D4852" stroke-width="1.6" stroke-dasharray="6 5"/><text class="t" x="1245.0" y="298" text-anchor="middle">Missing from the file</text><text class="s" x="1245.0" y="320" text-anchor="middle">(it was open before)</text><line x1="1245" y1="340" x2="1245" y2="380" marker-end="url(#a)"/><rect class="box" x="1110" y="380" width="270" height="80" rx="14" stroke="#3D4852" stroke-width="1.6" stroke-dasharray="6 5"/><text class="t" x="1245.0" y="408" text-anchor="middle">Listed in What changed</text><text class="s" x="1245.0" y="430" text-anchor="middle">QA checks it. Not closed automatically</text><line x1="720" y1="360" x2="720" y2="400" marker-end="url(#a)"/><text class="l" x="735" y="384" text-anchor="start">In both</text><polygon class="box" points="720,400 940,460 720,520 500,460" stroke="#007AC8" stroke-width="2.2"/><text class="t" x="720" y="458" text-anchor="middle">What does the file say</text><text class="t" x="720" y="478" text-anchor="middle">about this NCR?</text><line x1="720" y1="520" x2="720" y2="545"/><polyline points="200,545 200,570"/><polyline points="1100,545 1100,570"/><line x1="200" y1="545" x2="1100" y2="545"/><line x1="200" y1="545" x2="200" y2="590" marker-end="url(#a)"/><line x1="470" y1="545" x2="470" y2="590" marker-end="url(#a)"/><line x1="740" y1="545" x2="740" y2="590" marker-end="url(#a)"/><line x1="1100" y1="545" x2="1100" y2="590" marker-end="url(#a)"/><rect class="box" x="90" y="590" width="220" height="100" rx="14" stroke="#3D4852" stroke-width="1.6"/><text class="t" x="200.0" y="618" text-anchor="middle">Closed</text><text class="s" x="200.0" y="640" text-anchor="middle">Closed = Yes in the file</text><text class="s" x="200.0" y="658" text-anchor="middle">→ Closed page</text><rect class="box" x="360" y="590" width="220" height="100" rx="14" stroke="#3D4852" stroke-width="1.6"/><text class="t" x="470.0" y="618" text-anchor="middle">Jira closed</text><text class="s" x="470.0" y="640" text-anchor="middle">Remark contains “Jira”</text><text class="s" x="470.0" y="658" text-anchor="middle">→ Hold &amp; Jira page</text><rect class="box" x="630" y="590" width="220" height="100" rx="14" stroke="#3D4852" stroke-width="1.6"/><text class="t" x="740.0" y="618" text-anchor="middle">Hold for scrap</text><text class="s" x="740.0" y="640" text-anchor="middle">Remark has “hold” or “scrap”</text><text class="s" x="740.0" y="658" text-anchor="middle">→ Hold &amp; Jira page</text><text class="l" x="1115" y="572" text-anchor="start">Otherwise (still open)</text><polygon class="box" points="1100,588 1310,650 1100,712 890,650" stroke="#007AC8" stroke-width="2.2"/><text class="t" x="1100" y="648" text-anchor="middle">Buyer’s Remark</text><text class="t" x="1100" y="668" text-anchor="middle">changed?</text><line x1="1100" y1="712" x2="1100" y2="740"/><line x1="340" y1="740" x2="1100" y2="740"/><line x1="340" y1="740" x2="340" y2="790" marker-end="url(#a)"/><line x1="720" y1="740" x2="720" y2="790" marker-end="url(#a)"/><line x1="1100" y1="740" x2="1100" y2="790" marker-end="url(#a)"/><rect class="box" x="180" y="790" width="320" height="120" rx="14" stroke="#E67E22" stroke-width="2.4"/><text class="t" x="340.0" y="818" text-anchor="middle">Remark changed</text><text class="s" x="340.0" y="840" text-anchor="middle">Badge “Buyer updated”</text><text class="s" x="340.0" y="858" text-anchor="middle">Old and new text are saved</text><text class="s" x="340.0" y="876" text-anchor="middle">QA reads it → presses Reviewed</text><rect class="box" x="570" y="790" width="300" height="120" rx="14" stroke="#3D4852" stroke-width="1.6"/><text class="t" x="720.0" y="818" text-anchor="middle">Remark cleared</text><text class="s" x="720.0" y="840" text-anchor="middle">Logged as</text><text class="s" x="720.0" y="858" text-anchor="middle">“Buyer cleared Remarks”</text><text class="s" x="720.0" y="876" text-anchor="middle">Shown in What changed</text><rect class="box" x="940" y="790" width="320" height="120" rx="14" stroke="#3D4852" stroke-width="1.6"/><text class="t" x="1100.0" y="818" text-anchor="middle">Remark unchanged</text><text class="s" x="1100.0" y="840" text-anchor="middle">Nothing changes, stays in its list</text><text class="s" x="1100.0" y="858" text-anchor="middle">Badges: Still no remark ·</text><text class="s" x="1100.0" y="876" text-anchor="middle">No reply after 3 follow-ups · Open after 3 rounds</text><text class="s" x="1100.0" y="894" text-anchor="middle">QA can press Follow-up again</text><rect class="box" x="30" y="940" width="1380" height="70" rx="12" stroke-dasharray="6 5"/><text class="s" x="720" y="968" text-anchor="middle">File with no changes at all: the upload is still logged (“0 changes”), the banner can be dismissed and nothing moves. Wrong file? Press Undo this import.</text><text class="s" x="720" y="990" text-anchor="middle">A closed NCR that the file no longer marks as closed is reopened and shown in What changed.</text></g></svg></figure></body></html>
